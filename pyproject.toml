[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "videocutpub"
version = "1.0.0"
description = "Video Content Processing & Publishing Studio"
readme = "README.md"
authors = [
    { name = "FRAID0", email = "author@example.com" }
]
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6.0",
    "ffmpeg-python>=0.2.0",
    "pydantic>=2.0.0",
    "yt-dlp>=2024.0.0",
]

[project.optional-dependencies]
ai = [
    "faster-whisper>=1.0.0",
]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
